<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Lino, o papagaio brasileiro do Lingo">
  <style>
    .lino { transform-origin: 120px 150px; animation: flutuar 3.2s ease-in-out infinite; }
    .asa-e { transform-origin: 78px 168px; animation: bater 1.8s ease-in-out infinite; }
    .asa-d { transform-origin: 162px 168px; animation: bater-d 1.8s ease-in-out 0.12s infinite; }
    .rabo { transform-origin: 120px 210px; animation: abanar 2.6s ease-in-out infinite; }
    .olhos { transform-origin: 120px 108px; animation: piscar 4.6s ease-in-out infinite; }
    .bico { transform-origin: 120px 128px; animation: falar 3.4s ease-in-out infinite; }
    .brilho { animation: cintilar 2.4s ease-in-out infinite; }
    @keyframes flutuar {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-9px) rotate(1.4deg); }
    }
    @keyframes bater {
      0%, 100% { transform: rotate(0); }
      50% { transform: rotate(-16deg); }
    }
    @keyframes bater-d {
      0%, 100% { transform: rotate(0); }
      50% { transform: rotate(16deg); }
    }
    @keyframes abanar {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes piscar {
      0%, 88%, 100% { transform: scaleY(1); }
      92%, 95% { transform: scaleY(0.08); }
    }
    @keyframes falar {
      0%, 70%, 100% { transform: scaleY(1); }
      78% { transform: scaleY(0.86) translateY(2px); }
      86% { transform: scaleY(1); }
    }
    @keyframes cintilar {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lino, .asa-e, .asa-d, .rabo, .olhos, .bico, .brilho { animation: none; }
    }
  </style>
  <ellipse cx="120" cy="258" rx="46" ry="9" fill="#e8d9c8"/>
  <g class="lino">
    <g class="rabo">
      <path d="M104 206c-6 28-4 48 4 56 2-18 8-34 16-46z" fill="#2E9B3C"/>
      <path d="M118 208c0 32 4 50 14 58-2-20 0-38 2-50z" fill="#F5D031"/>
      <path d="M132 206c8 26 18 44 28 50-12-16-16-34-18-50z" fill="#2C6CB5"/>
    </g>
    <ellipse cx="120" cy="186" rx="48" ry="46" fill="#3CB54A"/>
    <ellipse cx="120" cy="198" rx="32" ry="28" fill="#BFEA9A"/>
    <g class="asa-e">
      <ellipse cx="72" cy="178" rx="22" ry="34" fill="#2E9B3C"/>
      <path d="M58 186c-2 12 2 24 10 30 2-10 6-18 8-26z" fill="#E23B2C"/>
    </g>
    <g class="asa-d">
      <ellipse cx="168" cy="178" rx="22" ry="34" fill="#2E9B3C"/>
      <path d="M182 186c2 12-2 24-10 30-2-10-6-18-8-26z" fill="#E23B2C"/>
    </g>
    <ellipse cx="104" cy="228" rx="10" ry="7" fill="#F4A027"/>
    <ellipse cx="136" cy="228" rx="10" ry="7" fill="#F4A027"/>
    <ellipse cx="120" cy="108" rx="62" ry="58" fill="#F5D031"/>
    <ellipse cx="120" cy="126" rx="54" ry="42" fill="#FFE27A"/>
    <path d="M68 92c12-28 32-40 52-40s40 12 52 40c-16-8-34-12-52-12s-36 4-52 12z" fill="#3CB54A"/>
    <circle cx="86" cy="128" r="12" fill="#FFB7C5" opacity=".7"/>
    <circle cx="154" cy="128" r="12" fill="#FFB7C5" opacity=".7"/>
    <g class="olhos">
      <ellipse cx="92" cy="108" rx="22" ry="26" fill="#fff"/>
      <ellipse cx="148" cy="108" rx="22" ry="26" fill="#fff"/>
      <ellipse cx="94" cy="112" rx="14" ry="16" fill="#2C2158"/>
      <ellipse cx="150" cy="112" rx="14" ry="16" fill="#2C2158"/>
      <ellipse cx="94" cy="114" rx="7" ry="8" fill="#3CB54A"/>
      <ellipse cx="150" cy="114" rx="7" ry="8" fill="#3CB54A"/>
      <circle cx="94" cy="114" r="4.2" fill="#1A1410"/>
      <circle cx="150" cy="114" r="4.2" fill="#1A1410"/>
      <circle cx="88" cy="100" r="6" fill="#fff"/>
      <circle cx="144" cy="100" r="6" fill="#fff"/>
      <circle cx="100" cy="118" r="2.2" fill="#fff"/>
      <circle cx="156" cy="118" r="2.2" fill="#fff"/>
    </g>
    <g class="bico">
      <path d="M120 118c12 2 18 12 16 22-10 4-22 4-32 0-2-10 4-20 16-22z" fill="#F4A027"/>
      <path d="M108 136c8 10 16 10 24 0-6 8-18 8-24 0z" fill="#E07820"/>
      <ellipse cx="120" cy="128" rx="4" ry="3" fill="#2C2158"/>
    </g>
    <circle class="brilho" cx="178" cy="58" r="5" fill="#E8B84A"/>
    <circle class="brilho" cx="62" cy="64" r="3.4" fill="#5B4FE8"/>
  </g>
</svg>
